# Lint configuration. `src` makes `app` first-party no matter which directory ruff runs from.
line-length = 120
src = ["."]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# These files adjust sys.path / os.environ before importing the application on purpose.
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
