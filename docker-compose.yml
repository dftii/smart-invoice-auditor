# SmartInvoice-FACe Auditor - orquestación local con Docker Compose.
#
# MODO POR DEFECTO (SQLite, sin servicios externos):
#   docker compose up --build
#   Interfaz web en http://localhost:8080
#   API y documentación interactiva en http://localhost:8000/docs
#
# PUERTOS: backend (8000) y mysql (3306) solo escuchan en 127.0.0.1 del equipo anfitrión, no en la red local.
# El frontend (8080) escucha en todas las interfaces; cámbialo a "127.0.0.1:8080:8080" si no lo necesitas en la LAN.
#
# FRONTEND (servicio "frontend", puerto 8080):
#   nginx sirve la SPA compilada y reenvía /api/, /health, /docs, /redoc y /openapi.json al backend
#   por la red interna de Compose. El navegador solo necesita el puerto 8080 para la interfaz.
#   nginx resuelve el host "backend" con el DNS de Docker en cada petición (no al arrancar), así que
#   el contenedor arranca aunque el backend todavía no exista; depends_on sigue esperando a su healthcheck.
#   Para desarrollo con recarga en caliente usa "npm run dev" en frontend/ (ver README).
#
# CONFIGURACIÓN:
#   - backend/.env (opcional) se pasa al contenedor del backend como variables de entorno.
#   - .env en la raíz (copia de .env.example) sustituye las variables de este fichero
#     (DATABASE_URL, MYSQL_*). Compose aplica "environment" después de "env_file", así que
#     DATABASE_URL de la raíz o del shell prevalece sobre la de backend/.env dentro de Docker.
#
# IMAGEN DEL BACKEND: el servicio backend construye la imagen "smartinvoice-backend:local" y el servicio seed
# la reutiliza sin reconstruirla. Si ejecutas seed antes de haber construido la imagen, primero ejecuta
# "docker compose build backend" (o "docker compose up --build -d backend").
#
# DATOS DE DEMOSTRACIÓN (servicio seed, perfil "seed"):
#   docker compose --profile seed run --rm seed
#   Para vaciar antes la base de datos, añade --reset al final:
#   docker compose --profile seed run --rm seed --reset
#   El servicio ejecuta "python scripts/seed.py" sobre el mismo volumen y base de datos
#   que el backend, y espera a que el backend esté sano.
#
# EJECUCIÓN CON MYSQL (perfil "mysql"):
#   1. Define la URL en el .env de la raíz o en el shell. Dentro de Compose el host es
#      "mysql" (el nombre del servicio), no "localhost":
#        DATABASE_URL=mysql+pymysql://smartinvoice:smartinvoice@mysql:3306/smartinvoice?charset=utf8mb4
#      PowerShell:  $env:DATABASE_URL = "mysql+pymysql://smartinvoice:smartinvoice@mysql:3306/smartinvoice?charset=utf8mb4"
#      Bash:        DATABASE_URL=mysql+pymysql://smartinvoice:smartinvoice@mysql:3306/smartinvoice?charset=utf8mb4 docker compose --profile mysql up
#   2. Levanta los servicios con el perfil mysql:
#        docker compose --profile mysql up --build -d
#      El backend espera a que MySQL supere su healthcheck antes de arrancar.
#   3. Para parar los servicios: docker compose --profile mysql down
#      (añade -v para borrar también los volúmenes de datos; es irreversible).
#
# Para ejecutar el backend en local con MySQL (sin Docker) usa en backend/.env el host
# "localhost" y el puerto publicado 3306 del servicio mysql (solo accesible desde este equipo).
#
# Los datos de SQLite y las facturas subidas se guardan en el volumen "backend-data".

services:
  backend:
    build: ./backend
    image: smartinvoice-backend:local
    restart: unless-stopped
    ports:
      # Solo accesible desde este equipo (documentación en http://localhost:8000/docs).
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/smartinvoice.db}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    # Misma imagen que backend (ya construida por el servicio backend); no se vuelve a construir aquí.
    image: smartinvoice-backend:local
    profiles: ["seed"]
    restart: "no"
    # El ENTRYPOINT fija el script; los argumentos de "run" (p. ej. --reset) se añaden al final.
    entrypoint: ["python", "scripts/seed.py"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/smartinvoice.db}
    volumes:
      - backend-data:/app/data
    # La imagen define un healthcheck para el servidor HTTP; el seed es un proceso puntual.
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    # Credenciales de desarrollo local. Cámbialas en el .env de la raíz; no usar en producción.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartinvoice-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smartinvoice}
      MYSQL_USER: ${MYSQL_USER:-smartinvoice}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartinvoice}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Solo accesible desde este equipo; MySQL no debe quedar expuesto en la red local.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  backend-data:
  mysql-data:
