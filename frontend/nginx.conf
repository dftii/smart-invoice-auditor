# Configuración de nginx para el frontend de SmartInvoice-FACe Auditor.
# Sirve la SPA compilada con Vite y reenvía /api/, /health, /docs, /redoc y /openapi.json al backend
# (servicio "backend" de Compose).
# Se ejecuta sin privilegios: no se declara "user" y el pid y los ficheros temporales van a /tmp.

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # DNS embebido de Docker (red de Compose). Con "set $backend" y proxy_pass con variable, nginx resuelve
    # "backend" en cada petición y no al arrancar: el contenedor levanta aunque el backend aún no exista,
    # y responde con error de pasarela mientras el backend esté caído.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Destino del backend. Con una variable y sin URI en proxy_pass, nginx reenvía la ruta y la query
        # exactamente como llegaron (/api/..., /health, /docs, /redoc, /openapi.json).
        set $backend http://backend:8000;

        # Tamaño máximo de subida: por encima del límite del backend (MAX_UPLOAD_SIZE_MB, 15 MB por defecto).
        client_max_body_size 16m;

        # Cabeceras de seguridad. Las locations que definen sus propias add_header repiten estas líneas,
        # porque nginx no hereda add_header del bloque server en esas locations.
        # CSP estricta para la SPA: sin scripts ni estilos en línea. Tailwind v4 compila a un CSS estático y React
        # aplica los estilos dinámicos por CSSOM, así que no hace falta 'unsafe-inline' en style-src.
        # Si VITE_API_BASE_URL apunta a otro origen, añádelo a connect-src.
        # 'wasm-unsafe-eval' solo permite compilar WebAssembly (no eval de JS): lo necesitan el OCR (Tesseract) y
        # pdf.js, que se sirven desde /ocr/ y /assets/ en este mismo origen.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        # Comprobación de salud del propio contenedor (no depende del backend).
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # API. El timeout de lectura supera AI_TIMEOUT_SECONDS (120 s por defecto) para la extracción con IA.
        location /api/ {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location = /health {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Esquema OpenAPI (JSON, sin ejecutar nada): hereda las cabeceras del bloque server.
        location = /openapi.json {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # Documentación interactiva de FastAPI (Swagger UI en /docs y ReDoc en /redoc). Necesitan una CSP propia:
        # cargan scripts y estilos de cdn.jsdelivr.net y usan scripts en línea. Solo afecta a estas rutas.
        location ~ ^/(docs|redoc)(/|$) {
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://cdn.jsdelivr.net https://fastapi.tiangolo.com; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Ficheros con hash generados por Vite: cache de un año e inmutables.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        # SPA: rutas desconocidas caen en index.html, que nunca se cachea para publicar versiones nuevas al instante.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
        }

        # Ficheros ocultos (.env, .git...) nunca se sirven.
        location ~ /\. {
            access_log off;
            log_not_found off;
            deny all;
        }
    }
}
